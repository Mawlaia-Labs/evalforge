[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "evalforge"
version = "0.1.0"
description = "Eval runner for LLM applications"
authors = ["Mawlaia <dev@mawlaia.com>"]
license = "MIT"
readme = "README.md"
homepage = "https://mawlaia.com"
repository = "https://github.com/mawlaia/evalforge"
packages = [{ include = "evalforge" }]

[tool.poetry.scripts]
evalforge = "evalforge.cli:main"

[tool.poetry.dependencies]
python  = "^3.10"
pydantic = "^2.0"
click    = "^8.0"

[tool.poetry.extras]
openai     = ["openai"]
anthropic  = ["anthropic"]
semantic   = ["sentence-transformers"]
all        = ["openai", "anthropic", "sentence-transformers"]

[tool.poetry.dependencies.openai]
version  = "^1.0"
optional = true

[tool.poetry.dependencies.anthropic]
version  = "^0.25"
optional = true

[tool.poetry.dependencies."sentence-transformers"]
version  = "^3.0"
optional = true

[tool.poetry.group.dev.dependencies]
pytest            = "^8.0"
pytest-asyncio    = "^0.23"
black             = "^24.0"
ruff              = "^0.4"
openai            = "^1.0"
anthropic         = "^0.25"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
